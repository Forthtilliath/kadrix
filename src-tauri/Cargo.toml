[package]
name = "kadrix"
version = "0.1.0"
description = "Traitement par lot de portraits pour trombinoscope"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "kadrix_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# ONNX Runtime (détection du visage + détourage), binaires téléchargés à la compilation.
ort = { version = "=2.0.0-rc.14" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "avif", "rayon"] }
webp = { version = "0.3", default-features = false }
rayon = "1.12"
sha2 = "0.11"
# TLS natif de Windows (schannel) : pas de dépendance C supplémentaire à compiler.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
base64 = "0.23"

[profile.dev.package."*"]
# Les dépendances (décodage d'image, ONNX) restent rapides même en mode dev.
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
